<!doctype html>
<html><head><meta charset="utf-8"><title>Page Tweaker</title><link rel="stylesheet" href="shell.css"></head><body>
<header><strong>Page Tweaker</strong><input id="address" aria-label="HTML file path, file URL, or public URL" placeholder="Paste or drop a file://, https://, or local .html path"><button id="open">Open</button><button id="file">Choose HTML</button><button id="annotate">Annotate</button><button class="primary" id="export">Export bundle</button></header>
<main><section id="stage"><webview id="page" preload="" partition="page-tweaker-public"></webview><canvas id="markup"></canvas><div id="empty"><h1>Open a page to start tweaking.</h1><p>Paste or drop a local <code>file://</code> URL, a public URL, or choose an HTML file.</p></div></section><aside><div id="selection"><h2>Select an element</h2><p>Click anything in the preview to adjust it.</p></div><div id="controls" hidden><label>Font family<select data-style="font-family"><option value="">Keep page font</option><option>Arial, sans-serif</option><option>Inter, sans-serif</option><option>Georgia, serif</option><option>"Helvetica Neue", sans-serif</option></select></label><label>Font size <input data-style="font-size" type="range"><output></output></label><label>Line height <input data-style="line-height" type="range"><output></output></label><label>Letter spacing <input data-style="letter-spacing" type="range"><output></output></label><label>Text color <input data-style="color" type="color"></label><label>Background <input data-style="background-color" type="color"></label><label>Margin <input data-style="margin" type="range"><output></output></label><label>Padding <input data-style="padding" type="range"><output></output></label><label>Replace text<textarea id="text"></textarea></label><button id="applyText">Update preview</button><p id="pinContext" class="hint"></p><label>AI note<textarea id="note" placeholder="Explain the change this selected element needs"></textarea></label><button id="pinNote">Pin note to selected element</button><button id="reset">Reset selected overrides</button></div><section id="annotationControls" hidden><h3>Markup</h3><p class="hint">Draw over the page. This does not change the page.</p><div class="swatches" aria-label="Markup color"><button data-color="#f25f5c" class="swatch active" title="Coral"></button><button data-color="#ffca56" class="swatch" title="Yellow"></button><button data-color="#64d7ff" class="swatch" title="Blue"></button><button data-color="#8be28b" class="swatch" title="Green"></button><button data-color="#ffffff" class="swatch" title="White"></button></div><label>Line thickness <input id="annotationThickness" type="range" min="1" max="14" step="1" value="3"><output id="annotationThicknessValue">3 px</output></label></section><div id="notes"></div></aside></main><footer id="status">Preview-only changes. Your source is never modified.</footer><script src="browser-utils.js"></script><script src="renderer.js"></script></body></html>
