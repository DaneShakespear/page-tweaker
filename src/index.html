<!doctype html><html><head><meta charset="utf-8"><title>Page Tweaker</title><link rel="stylesheet" href="shell.css"></head><body>
<header><strong>Page Tweaker</strong><input id="address" aria-label="HTML file path or public URL" placeholder="Paste a public URL or open a local HTML file"><button id="open">Open</button><button id="file">Choose HTML</button><button id="annotate">Annotate</button><button class="primary" id="export">Export bundle</button></header>
<main><section id="stage"><webview id="page" preload="" partition="page-tweaker-public"></webview><canvas id="markup"></canvas><div id="empty"><h1>Open a page to start tweaking.</h1><p>Choose a local HTML artifact or paste a public URL.</p></div></section><aside><div id="selection"><h2>Select an element</h2><p>Click anything in the preview to adjust it.</p></div><div id="controls" hidden><label>Font size <input data-style="font-size" type="range" min="8" max="96"><output></output></label><label>Line height <input data-style="line-height" type="range" min="0.8" max="3" step="0.05"><output></output></label><label>Letter spacing <input data-style="letter-spacing" type="range" min="-2" max="12" step="0.25"><output></output></label><label>Text color <input data-style="color" type="color"></label><label>Background <input data-style="background-color" type="color"></label><label>Margin <input data-style="margin" type="range" min="0" max="96"><output></output></label><label>Padding <input data-style="padding" type="range" min="0" max="96"><output></output></label><label>Replace text<textarea id="text"></textarea></label><button id="applyText">Update preview</button><label>AI note<textarea id="note" placeholder="Move this above section 2, simplify it, remove it…"></textarea></label><button id="pinNote">Pin note</button><button id="reset">Reset selected overrides</button></div><div id="notes"></div></aside></main><footer id="status">Preview-only changes. Your source is never modified.</footer><script src="renderer.js"></script></body></html>
