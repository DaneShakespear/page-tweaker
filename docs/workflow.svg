<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">Page Tweaker workflow</title><desc id="desc">Open a page, make visual changes, add context, export a handoff bundle, and implement the change.</desc><rect width="1200" height="360" fill="#111318" rx="24"/><style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}.card{fill:#1c2129;stroke:#364150;stroke-width:2}.number{fill:#1fb9ea}.label{fill:#f3f6fa;font-size:21px;font-weight:700}.copy{fill:#aeb9c7;font-size:15px}.arrow{stroke:#5b7187;stroke-width:3;fill:none}</style><path class="arrow" d="M220 180H270m-16-12 16 12-16 12M470 180H520m-16-12 16 12-16 12M720 180H770m-16-12 16 12-16 12M970 180H1020m-16-12 16 12-16 12"/><g transform="translate(35 95)"><rect class="card" width="185" height="170" rx="16"/><circle class="number" cx="28" cy="28" r="15"/><text x="23" y="34" fill="#0e151b" font-weight="700">1</text><text class="label" x="22" y="82">Open</text><text class="copy" x="22" y="112">Local HTML or a</text><text class="copy" x="22" y="134">public URL</text></g><g transform="translate(285 95)"><rect class="card" width="185" height="170" rx="16"/><circle class="number" cx="28" cy="28" r="15"/><text x="23" y="34" fill="#0e151b" font-weight="700">2</text><text class="label" x="22" y="82">Tune</text><text class="copy" x="22" y="112">Click, adjust,</text><text class="copy" x="22" y="134">see it instantly</text></g><g transform="translate(535 95)"><rect class="card" width="185" height="170" rx="16"/><circle class="number" cx="28" cy="28" r="15"/><text x="23" y="34" fill="#0e151b" font-weight="700">3</text><text class="label" x="22" y="82">Explain</text><text class="copy" x="22" y="112">Pin AI notes and</text><text class="copy" x="22" y="134">draw markup</text></g><g transform="translate(785 95)"><rect class="card" width="185" height="170" rx="16"/><circle class="number" cx="28" cy="28" r="15"/><text x="23" y="34" fill="#0e151b" font-weight="700">4</text><text class="label" x="22" y="82">Export</text><text class="copy" x="22" y="112">Structured JSON,</text><text class="copy" x="22" y="134">prompt, screenshot</text></g><g transform="translate(1035 95)"><rect class="card" width="130" height="170" rx="16"/><circle class="number" cx="28" cy="28" r="15"/><text x="23" y="34" fill="#0e151b" font-weight="700">5</text><text class="label" x="22" y="82">Ship</text><text class="copy" x="22" y="112">Give the</text><text class="copy" x="22" y="134">bundle to AI</text></g></svg>
